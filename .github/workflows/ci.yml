name: Sourcebook CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sourcebook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax checks
        run: node --check src/*.mjs sw.js
