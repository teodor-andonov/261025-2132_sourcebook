name: Sourcebook CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/ci.yml'
  # Every PR, including documentation/workflow-only changes, must pass CI before squash merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sourcebook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax checks
        run: |
          node --check src/*.mjs
          node --input-type=module --check < sw.js

  browser-smoke:
    name: Chromium M0 browser smoke
    # Playwright 1.56.1 supports Ubuntu 24.04; latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser harness
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium engine
        run: npx playwright install --with-deps chromium
      - name: Browser engine smoke (no screenshots)
        run: node scripts/browser-smoke.mjs
