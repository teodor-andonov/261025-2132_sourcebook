name: Prune merged development branches

# Run after main changes (including squash merges). No screenshots or publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sourcebook-merged-dev-prune
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'teodor-andonov/261025-2132_sourcebook'
    runs-on: ubuntu-latest
    steps:
      # Load trusted main, never source from an unmerged PR.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove only verified merged dev branch refs
        uses: actions/github-script@v7
        with:
          script: |
            const {pruneMergedDevBranches}=require('./scripts/prune-merged-dev-branches.cjs');
            await pruneMergedDevBranches({
              github, core, owner: context.repo.owner, repo: context.repo.repo
            });
