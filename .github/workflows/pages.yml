name: Publish Sourcebook

# Development commits do not publish the live PWA.
# A nightly check deploys only if web app files differ from the last successful
# publishing run. Run this workflow manually for an immediate release.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: sourcebook-live-deployment
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check last successful publication
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual release requested"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
          if [[ -z "$previous" ]] || ! git cat-file -e "${previous}^{commit}" 2>/dev/null; then
            echo "No previous successful release found. Publishing."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$previous" "$GITHUB_SHA" -- index.html manifest.webmanifest sw.js src/ assets/; then
            echo "No app changes since last successful publishing run. Skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "App changed since $previous. Publishing."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: decide
    if: needs.decide.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release
        run: |
          node --test tests/*.test.mjs
          node --check src/*.mjs sw.js
      - name: Stage only PWA web assets
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R src assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
